name: Publiser på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Ingen tilganger som standard. Hver jobb får bare det den trenger.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Alle verktøy er låst til en fast commit, så en endret versjonsmerkelapp ikke kan snike inn annen kode.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Ingen hurtiglager: byggingen er liten, og et forgiftet lager kunne endret siden som publiseres.
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  publiser:
    needs: bygg
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publisering.outputs.page_url }}
    steps:
      - id: publisering
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
